<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Muff-Mojo playground</title>
<style>
  body { margin: 0; font: 14px system-ui, sans-serif; background: #efeae2; display: grid; grid-template-columns: 1fr 380px; height: 100vh; }
  .chat { display: flex; flex-direction: column; justify-content: flex-end; padding: 16px; gap: 12px; }
  .box { background: #fff; border-radius: 22px; padding: 10px 16px; min-height: 22px; outline: none; }
  textarea { font: inherit; border-radius: 12px; border: 1px solid #ccc; padding: 10px; height: 60px; }
  iframe { border: 0; width: 360px; height: 520px; margin: 10px; box-shadow: 0 4px 20px rgba(0,0,0,.15); border-radius: 12px; }
  label { font-size: 12px; color: #555; }
</style>
</head>
<body>
  <div class="chat">
    <label>contenteditable (WhatsApp-style)</label>
    <div id="ce" class="box" contenteditable="true"></div>
    <label>textarea (Instagram comments-style)</label>
    <textarea id="ta"></textarea>
  </div>
  <iframe src="../popup.html" title="popup"></iframe>
  <script src="../emoji-data.js"></script>
  <script src="../emojis.js"></script>
  <script src="../content.js"></script>
</body>
</html>
